name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild on 1 January so the deployed HTML can never carry a stale tax year.
  # The runtime script also corrects a stale build client-side, but a crawler
  # does not run JS — so the static HTML has to be right on its own.
  schedule:
    - cron: '5 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The year math is the site's factual spine: a regression here is a
      # regression in what we tell people about their legal rights.
      # Never deploy on failing tests.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Guard against the specific failure modes that matter for this site.
      #
      # Two layers, deliberately:
      #
      #   1. `npm run verify` (scripts/verify-dist.mjs) — the substantive
      #      checks. It PARSES the JSON-LD rather than grepping for the script
      #      tag, asserts real pixel dimensions out of the PNG headers, and
      #      asserts the things that must be ABSENT: no streetAddress, no fee
      #      in schema, no FAQPage/HowTo/Review/AggregateRating, and no licence
      #      identifier while LICENCE_NUMBER is still null.
      #
      #   2. The shell checks below — the handful that must hold even if
      #      someone breaks or deletes that script. Keep these cheap and
      #      independent; anything needing real logic belongs in the script.
      - name: Verify dist
        run: npm run verify

      - name: Verify build output
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          grep -q 'ledger__row' dist/index.html \
            || fail "Years ledger missing from static HTML"

          [ "$(grep -c 'trigger__name' dist/index.html)" -ge 9 ] \
            || fail "Refund triggers missing from static HTML"

          grep -q 'wa.me' dist/index.html \
            || fail "WhatsApp link missing"

          if grep -qE '\{\{[A-Z_]+\}\}' dist/index.html; then
            fail "Unsubstituted template token in output"
          fi

          # Deploy infrastructure. Without .nojekyll, GitHub Pages runs the
          # output through Jekyll, which ignores paths beginning with _ and
          # can mangle non-ASCII ones — i.e. exactly our Hebrew slug.
          [ -f dist/.nojekyll ] || fail ".nojekyll missing — Jekyll will process the deploy"
          [ -f dist/CNAME ]     || fail "CNAME missing — the custom domain will unbind"

          # SEO plumbing and brand assets.
          for f in robots.txt sitemap.xml favicon.svg favicon-32.png \
                   apple-touch-icon.png og-image.png site.webmanifest; do
            [ -f "dist/$f" ] || fail "dist/$f missing"
          done

          # The accessibility statement is legally required on an Israeli
          # commercial site, and its URL is a Hebrew slug produced at build time
          # from an ASCII source file. Assert the OUTPUT path, because that
          # rename is the fragile part.
          [ -f 'dist/נגישות/index.html' ] \
            || fail "Accessibility statement missing at the Hebrew slug"
          # Written as an `if` rather than `[ -f x ] && fail`: under `set -e`
          # the latter aborts the script when the file is absent, which is the
          # PASSING case.
          if [ -f dist/accessibility.html ]; then
            fail "ASCII accessibility.html left in dist — the slug rename did not run"
          fi

          grep -q 'application/ld+json' dist/index.html \
            || fail "JSON-LD missing from the homepage"

          # Compliance tripwires. These strings are prohibited for a licensed
          # CPA under תקנות רואי חשבון — see docs/spec/02-constraints.md.
          # A build that contains them must not reach the public.
          # Checked across EVERY emitted HTML document, not just the homepage.
          for doc in $(find dist -name '*.html'); do
            if grep -q 'חינם' "$doc"; then
              fail "Prohibited word 'חינם' in $doc — use 'ללא עלות'"
            fi
            if grep -q 'מומחה' "$doc"; then
              fail "Prohibited word 'מומחה' in $doc — only 'מתמחה' is permitted"
            fi
            if grep -q '7 שנים' "$doc"; then
              fail "Factually wrong in $doc: the income-tax window is 6 years, not 7"
            fi
            # 2(ג)(4) requires the ancillary-service distinction on every page.
            grep -q 'שירות נלווה' "$doc" \
              || fail "$doc does not label the service as 'שירות נלווה'"
          done

          # House style: no em/en dashes in Hebrew text a visitor or a crawler
          # sees — body copy, titles, meta descriptions, JSON-LD values, alt
          # text. It is a recognisable machine-writing tell and the owner has
          # explicitly rejected it. HTML comments are stripped first, since
          # dashes there are never rendered. See AGENTS.md § House style.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true })
              .flatMap((e) => e.isDirectory()
                ? walk(path.join(d, e.name))
                : (e.name.endsWith(".html") ? [path.join(d, e.name)] : []));
            let bad = 0;
            for (const f of walk("dist")) {
              const s = fs.readFileSync(f, "utf8").replace(/<!--[\s\S]*?-->/g, "");
              for (const m of s.matchAll(/[^\n<>]{0,60}[\u2014\u2013][^\n<>]{0,40}/g)) {
                const t = m[0].trim();
                if (!/[\u0590-\u05FF]/.test(t)) continue;
                console.error(`::error file=${f}::em/en dash in Hebrew copy: ${t}`);
                bad++;
              }
            }
            if (bad) {
              console.error("Rewrite the sentence; do not swap the dash for a comma.");
              console.error("See AGENTS.md for the substitution table.");
              process.exit(1);
            }
          '

          echo "✓ build verified"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
